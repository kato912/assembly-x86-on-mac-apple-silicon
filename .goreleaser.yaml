# GoReleaser configuration: builds static binaries for macOS, Linux and
# Windows, uploads them to GitHub Releases and updates the Homebrew tap.
# Runs from .github/workflows/release.yml when a v* tag is pushed.
version: 2
project_name: nasmx86

builds:
  - id: unix
    main: ./cmd/nasmx86
    binary: nasmx86
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: windows
    main: ./cmd/nasmx86
    binary: nasmx86
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - id: unix
    ids: [unix]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.th.md
      - examples/*.asm
  - id: windows
    ids: [windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.th.md
      - examples/*.asm
      - src: packaging/INSTALL-WINDOWS.txt
        dst: INSTALL-WINDOWS.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^Merge"]

# Homebrew cask (Casks/nasmx86.rb in kato912/homebrew-tap). A cask, unlike
# a formula, never counts as a build from source, so Homebrew does not demand
# an up-to-date Xcode or Command Line Tools just to copy a prebuilt binary.
# Users still type: brew install kato912/tap/nasmx86
homebrew_casks:
  - name: nasmx86
    ids: [unix]
    binaries: [nasmx86]
    repository:
      owner: kato912
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/kato912/assembly-x86-on-mac-apple-silicon"
    description: "Run 32/64-bit x86 Linux NASM programs anywhere, no VM needed"
    commit_author:
      name: kato912
      email: 89004444+kato912@users.noreply.github.com
    commit_msg_template: "nasmx86 {{ .Tag }}"
    dependencies:
      - formula: nasm
      # The course's assembler: yasm -f elf64 -g dwarf2 -o hello.o hello.s
      - formula: yasm
    # On macOS, also bring the DDD debugger (--ddd), the x86 gdb under it
    # and XQuartz, the X11 window system DDD draws with. Only on macOS:
    # there is no XQuartz on Linux. `brew uninstall nasmx86` removes the
    # formulae again when nothing else needs them; XQuartz is a cask, which
    # Homebrew never removes by itself (brew uninstall nasmx86 xquartz).
    # nasm-x86 and yasm-x86 are nasmx86 too: the real nasm and yasm under
    # names that say the code is x86 (nasm-x86 -f elf64 -o hello.o hello.asm).
    custom_block: |
      binary "nasmx86", target: "nasm-x86"
      binary "nasmx86", target: "yasm-x86"
      on_macos do
        depends_on formula: [
          "ddd",
          "x86_64-elf-gdb",
        ]
        depends_on cask: "xquartz"
      end
    hooks:
      post:
        # The binary is ad-hoc signed but not notarized: clear the
        # quarantine flag so Gatekeeper does not block it.
        # Then nasmx86 setup adds a few lines to ~/.zshrc so that in new
        # terminals ld, gcc, ddd and gdb are nasmx86's (they hand the Mac's
        # own files to the Mac's ld and gcc): course commands such as
        # ld -o hello hello.o, ./hello and ddd ./hello & work as typed.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/nasmx86"]
            run "{{ .StagedPath }}/nasmx86", args: ["setup"], must_succeed: false, print_stdout: true,
                writable_paths: [".zshrc", ".bash_profile"], writable_base: :home
          end
      pre:
        # brew uninstall takes those lines out again.
        uninstall_steps: |
          on_macos do
            run "{{ .StagedPath }}/nasmx86", args: ["setup", "--remove"], must_succeed: false, print_stdout: true,
                writable_paths: [".zshrc", ".bash_profile"], writable_base: :home
          end
    caveats: |
      Example programs: https://github.com/kato912/assembly-x86-on-mac-apple-silicon/tree/main/examples
      Try:  nasmx86 hello.asm   (nasmx86 --help for options, --th for Thai)
      Debug in DDD (macOS):  nasmx86 --ddd hello.asm
      Linux commands (macOS, in a new terminal window):
        nasm-x86 -f elf64 -g -F dwarf -o hello.o hello.asm   (or yasm-x86 ... hello.s)
        ld -o hello hello.o      (or gcc -o hello hello.o for main and printf)
        ./hello
        ddd ./hello &
      Remove it all (macOS):  brew uninstall nasmx86 xquartz
