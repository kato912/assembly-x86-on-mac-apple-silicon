name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: go vet ./...
      - name: Unit tests
        run: go test ./...
        env:
          NASMX86_NATIVE: "0"

  differential:
    # The source of truth: every test program is assembled with nasm, linked
    # with GNU ld and run natively on x86-64 Linux, then run through nasmx86;
    # stdout (register/flag dumps) and exit status must be identical.
    name: differential (native x86-64 vs nasmx86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nasm binutils
      - run: nasm -v && ld -v && uname -m && grep -m1 'model name' /proc/cpuinfo
      - name: Differential tests
        run: go test ./internal/difftest -v -count=1
        env:
          NASMX86_REQUIRE_NATIVE: "1"
