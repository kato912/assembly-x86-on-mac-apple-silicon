name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned images: a moving "-latest" label can drop packages (nasm)
        # or change tools under us.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-install-nasm.sh
      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: go vet ./...
      - name: Unit tests
        shell: bash
        run: go test ./... 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        env:
          NASMX86_NATIVE: "0"
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: scripts/annotate-failures.sh test-output.txt

  differential:
    # The source of truth: every test program is assembled with nasm, linked
    # with GNU ld and run natively on x86-64 Linux, then run through nasmx86;
    # stdout (register/flag dumps) and exit status must be identical.
    name: differential (native x86-64 vs nasmx86)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nasm
        run: scripts/ci-install-nasm.sh
      - name: Install gcc -m32 (for the 32-bit C library tests)
        run: scripts/ci-install-multilib.sh
      - run: nasm -v && ld -v && gcc --version | head -1 && ldd --version | head -1 && uname -m && grep -m1 'model name' /proc/cpuinfo
      - name: Differential tests
        shell: bash
        run: go test ./internal/difftest -v -count=1 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        env:
          NASMX86_REQUIRE_NATIVE: "1"
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: scripts/annotate-failures.sh test-output.txt
